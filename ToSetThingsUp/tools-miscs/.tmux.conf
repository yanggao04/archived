# ~/.tmux.conf

# ============================================================
# Prefix key: change from Ctrl+b to Ctrl+`
# Note: some terminals intercept Ctrl+`, try Ctrl+a if it fails
# ============================================================
# unbind C-b                      # remove default prefix Ctrl+b
set -g prefix C-`               # set new prefix to Ctrl+`
bind C-` send-prefix            # press Ctrl+` twice to send literal Ctrl+`

# ============================================================
# Mouse support
# ============================================================
set -g mouse on                 # enable mouse: click panes, resize, scroll, select

# ============================================================
# Basic behavior
# ============================================================
set -g default-terminal "tmux-256color"                 # use 256-color terminfo
set -ga terminal-overrides ",*256col*:Tc"               # enable true color (24-bit), otherwise there may be distortions for some apps
set -sg escape-time 10                                  # reduce Esc delay for vim
set -g focus-events on                                  # pass focus events to apps
set -g history-limit 10000                              # scrollback buffer lines

# set -g base-index 1             # window numbering starts at 1
# setw -g pane-base-index 1       # pane numbering starts at 1
# set -g renumber-windows on      # renumber windows after one is closed

# ============================================================
# Splitting panes (keep current path)
# ============================================================
bind | split-window -h -c "#{pane_current_path}"        # prefix + | : split vertically
bind - split-window -v -c "#{pane_current_path}"        # prefix + - : split horizontally
unbind '"'                      # remove default horizontal split
unbind %                        # remove default vertical split

# ============================================================
# Vim-style pane navigation
# ============================================================
bind h select-pane -L           # prefix + h : move to left pane
bind j select-pane -D           # prefix + j : move to lower pane
bind k select-pane -U           # prefix + k : move to upper pane
bind l select-pane -R           # prefix + l : move to right pane

# ============================================================
# Copy mode: vi keys
# ============================================================
setw -g mode-keys vi            # use vi keys in copy mode

# ============================================================
# Reload config
# ============================================================
bind r source-file ~/.tmux.conf \; display "Config reloaded"
